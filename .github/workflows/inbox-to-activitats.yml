name: INBOX a Activitats

on:
  schedule:
    # Cada dia a les 07:30 (una mica abans que el scheduler de publicació,
    # perquè les activitats acabades de crear ja hi puguin ser a temps)
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # permet executar-lo manualment des de GitHub

jobs:
  sync-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_ACTIVITATS_DB_ID: ${{ secrets.NOTION_ACTIVITATS_DB_ID }}
        run: python inbox_sync/inbox_to_activitats.py
