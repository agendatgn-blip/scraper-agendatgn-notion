name: Stories per activitat (7:00)

# Una story per cada activitat recomanada del dia, enviada per Telegram entre
# les 7:00 i les 8:00 (hora de Tarragona). El cron de GitHub va en UTC i sovint
# arriba tard, per això hi ha diverses passades: l'script només envia a partir de
# les 7:00 i un sol cop al dia (si ja s'han enviat, no fa res).
on:
  schedule:
    - cron: "0,10,20,30,40,50 5,6 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Dia AAAA-MM-DD (buit = avui). Les torna a fer i enviar."
        required: false
        default: ""

concurrency:
  group: stories-activitats
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests Pillow
      - name: Stories per activitat
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ACTIVITATS_DB_ID: ${{ secrets.NOTION_ACTIVITATS_DB_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          DATA: ${{ inputs.data }}
        run: |
          ARGS="--nomes-activitats"
          if [ "$MANUAL" = "true" ]; then ARGS="$ARGS --forcar"; fi
          if [ -n "$DATA" ]; then ARGS="$ARGS --data $DATA"; fi
          python scheduler/stories_ig.py $ARGS
