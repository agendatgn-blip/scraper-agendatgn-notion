name: Publish Scheduler AgendaTGN

on:
  schedule:
    # Cada 15 minuts de 05:07 a 13:52 UTC (07:07-15:52 a l'estiu, 06:07-14:52 a l'hivern).
    # L'script mira l'hora de Tarragona i reparteix els posts entre les 07:45 i les 14:00.
    # Minuts "estranys" (7, 22, 37, 52) perquè GitHub endarrereix menys que a l'hora en punt.
    - cron: "7,22,37,52 5-13 * * *"
  workflow_dispatch:
    inputs:
      publicar_tot_ara:
        description: "Publicar ara TOTS els pendents (sense repartir)"
        type: boolean
        default: false

# Mai dues passades alhora (evita posts duplicats)
concurrency:
  group: publish-scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ACTIVITATS_DB_ID: ${{ secrets.NOTION_ACTIVITATS_DB_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PUBLICAR_TOT_ARA: ${{ github.event.inputs.publicar_tot_ara }}
        run: python scheduler/publish_scheduler.py
